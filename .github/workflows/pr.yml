name: Pr

on: pull_request

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{steps.version.outputs.value}}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          value="$(tr -d '\r\n ' < version.txt)"
          echo "value=${value}" >> $GITHUB_OUTPUT

  unix:
    needs: version
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: macos-15-intel
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build qt
        uses: ./.github/actions/unix
        id: build
        with:
          version: ${{needs.version.outputs.value}}

      - name: Upload qt build
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Build test
        shell: bash
        run: |
          fn="${{steps.build.outputs.fn}}"
          qtdir="${fn%.tar.gz}"
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{github.workspace}}/$qtdir"
          cmake --build test/build --parallel ${cores}

      - name: Upload test
        uses: actions/upload-artifact@v7
        with:
          name: qt_static_test_macos_${{env.arch}}
          path: "${{github.workspace}}/test/build/qt_static_test"

      - name: Run test
        shell: bash
        run: ./test/build/qt_static_test

  windows:
    needs: version
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            comp: llvm1706
            archive: llvm-mingw-20231128-ucrt-x86_64.zip
            link: https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/
          - os: windows-2022
            comp: mingw1310
            archive: MinGW-w64-x86_64-13.1.0-release-posix-seh-msvcrt-rt_v11-rev1.7z
            link: https://download.qt.io/development_releases/prebuilt/mingw_64/
          - os: windows-11-arm
            comp: llvm1706
            archive: llvm-mingw-20231128-ucrt-aarch64.zip
            link: https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build qt
        uses: ./.github/actions/windows
        id: build
        with:
          version: ${{needs.version.outputs.value}}
          comp:    ${{matrix.comp}}
          archive: ${{matrix.archive}}
          link:    ${{matrix.link}}

      - name: Upload qt build
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Build test
        shell: powershell
        run: |
          $fn = "${{steps.build.outputs.fn}}"
          $qtdir = $fn -replace '\.zip$', ''
          cmake `
            -S test `
            -B test/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{github.workspace}}\$qtdir" `
            -DCMAKE_C_COMPILER="gcc.exe" -DCMAKE_CXX_COMPILER="g++.exe" -G"Ninja"
          cmake --build test/build --parallel ${env:NUMBER_OF_PROCESSORS}

      - name: Upload test
        uses: actions/upload-artifact@v7
        with:
          name: qt_static_test_${{matrix.comp}}_${{env.arch}}.exe
          path: "${{github.workspace}}/test/build/qt_static_test.exe"

      - name: Run test
        shell: powershell
        run: ./test/build/qt_static_test.exe

  windows-msvc:
    needs: version
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build qt
        uses: ./.github/actions/windows-msvc
        id: build
        with:
          version: ${{needs.version.outputs.value}}

      - name: Upload qt build
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Build test
        shell: cmd
        run: |
          call "${{env.vspath}}\VC\Auxiliary\Build\vcvarsall.bat" ${{env.arch}}
          set "fn=${{steps.build.outputs.fn}}"
          set "qtdir=%fn:.zip=%"
          cmake ^
            -S test ^
            -B test/build ^
            -DCMAKE_PREFIX_PATH="${{github.workspace}}\%qtdir%"
          cmake --build test/build --config Release

      - name: Upload test
        uses: actions/upload-artifact@v7
        with:
          name: qt_static_test_msvc_${{env.arch}}.exe
          path: "${{github.workspace}}/test/build/Release/qt_static_test.exe"

      - name: Run test
        shell: powershell
        run: ./test/build/Release/qt_static_test.exe

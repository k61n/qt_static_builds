name: Pr

on: pull_request

jobs:
  release_id:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.release_draft.outputs.version}}
    steps:
      - uses: actions/checkout@v4

      - id: release_draft
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          version="$(tr -d '\r\n ' < version.txt)"
          echo "version=${version}" >> $GITHUB_OUTPUT

  unix:
    needs: release_id
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: macos-15-intel
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: ./.github/actions/unix
        id: build
        with:
          version: ${{needs.release_id.outputs.version}}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Build test
        shell: bash
        run: |
          fn="${{steps.build.outputs.fn}}"
          qtdir="${fn%.tar.gz}"
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{github.workspace}}/$qtdir"
          cmake --build test/build --parallel ${cores}

      - uses: actions/upload-artifact@v4
        with:
          name: qt_static_test_macos_${{env.arch}}
          path: "${{github.workspace}}/test/build/qt_static_test"

      - name: Run test
        shell: bash
        run: ./test/build/qt_static_test

  windows:
    needs: release_id
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            comp: llvm1706
            archive: llvm-mingw-20231128-ucrt-x86_64.zip
            link: https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/
          - os: windows-2022
            comp: mingw1310
            archive: MinGW-w64-x86_64-13.1.0-release-posix-seh-msvcrt-rt_v11-rev1.7z
            link: https://download.qt.io/development_releases/prebuilt/mingw_64/
          - os: windows-11-arm
            comp: llvm1706
            archive: llvm-mingw-20231128-ucrt-aarch64.zip
            link: https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup compiler
        shell: powershell
        run: |
          Remove-Item C:\mingw64 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\LLVM" -Recurse -Force -ErrorAction SilentlyContinue
          Start-BitsTransfer -Source ${{matrix.link}}${{matrix.archive}} -Destination .
          $folder = (7z l .\${{matrix.archive}} -ba `
            | Select-String '(?<=\s)([^\s\\]+)(?=\\)' `
            | Select-Object -First 1).Matches[0].Groups[1].Value
          7z x .\${{matrix.archive}} -o"C:\"
          Rename-Item -Path "C:\$folder" -NewName "mingw64" -ErrorAction SilentlyContinue

      - uses: ./.github/actions/windows
        id: build
        with:
          version: ${{needs.release_id.outputs.version}}
          comp:    ${{matrix.comp}}
          archive: ${{matrix.archive}}
          link:    ${{matrix.link}}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Build test
        shell: powershell
        run: |
          $fn = "${{steps.build.outputs.fn}}"
          $qtdir = $fn -replace '\.zip$', ''
          cmake `
            -S test `
            -B test/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{github.workspace}}\$qtdir" `
            -DCMAKE_C_COMPILER="gcc.exe" -DCMAKE_CXX_COMPILER="g++.exe" -G"Ninja"
          cmake --build test/build --parallel ${env:NUMBER_OF_PROCESSORS}

      - uses: actions/upload-artifact@v4
        with:
          name: qt_static_test_${{matrix.comp}}_${{env.arch}}.exe
          path: "${{github.workspace}}/test/build/qt_static_test.exe"

      - name: Run test
        shell: powershell
        run: ./test/build/qt_static_test.exe

  windows-msvc:
    needs: release_id
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: ./.github/actions/windows-msvc
        id: build
        with:
          version: ${{needs.release_id.outputs.version}}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Build test
        shell: cmd
        run: |
          call "${{env.vspath}}\VC\Auxiliary\Build\vcvarsall.bat" ${{env.arch}}
          set "fn=${{steps.build.outputs.fn}}"
          set "qtdir=%fn:.zip=%"
          cmake ^
            -S test ^
            -B test/build ^
            -DCMAKE_PREFIX_PATH="${{github.workspace}}\%qtdir%"
          cmake --build test/build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: qt_static_test_msvc_${{env.arch}}.exe
          path: "${{github.workspace}}/test/build/Release/qt_static_test.exe"

      - name: Run test
        shell: powershell
        run: ./test/build/Release/qt_static_test.exe

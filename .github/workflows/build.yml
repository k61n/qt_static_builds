name: Build

on:
  push:
    branches: [ "main" ]

jobs:
  release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{steps.release_draft.outputs.version}}
      release_id: ${{steps.release_draft.outputs.release_id}}
    steps:
      - uses: actions/checkout@v7

      - id: release_draft
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          version="$(tr -d '\r\n ' < version.txt)"
          echo "version=${version}" >> $GITHUB_OUTPUT
          tagexists="$(gh release list --limit 10 --json tagName \
            --jq ".[] | select (.tagName==\"${version}\") | .tagName")"
          if [ -z "${tagexists}" ]; then
            gh release create "${version}" \
              --target main \
              --draft \
              --title "qt_${version}" \
              --notes "qt ${version}"
          fi
          release_id="$(gh release view "${version}" --json databaseId --jq .databaseId)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  unix:
    needs: release_draft
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: macos-15-intel
#          - os: ubuntu-22.04     # fails due to insufficient space
#          - os: ubuntu-22.04-arm # fails due to insufficient space
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build qt
        uses: ./.github/actions/unix
        id: build
        with:
          version: ${{needs.release_draft.outputs.version}}

      - name: Upload qt build
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Store qt build in release page
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{secrets.GITHUB_TOKEN}}
          file:       "${{github.workspace}}/${{steps.build.outputs.fn}}"
          asset_name: ${{steps.build.outputs.fn}}
          release_id: ${{needs.release_draft.outputs.release_id}}
          overwrite:  true

  windows:
    needs: release_draft
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            comp: llvm1706
            archive: llvm-mingw-20231128-ucrt-x86_64.zip
            link: https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/
          - os: windows-2022
            comp: mingw1310
            archive: MinGW-w64-x86_64-13.1.0-release-posix-seh-msvcrt-rt_v11-rev1.7z
            link: https://download.qt.io/development_releases/prebuilt/mingw_64/
          - os: windows-11-arm
            comp: llvm1706
            archive: llvm-mingw-20231128-ucrt-aarch64.zip
            link: https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build qt
        uses: ./.github/actions/windows
        id: build
        with:
          version: ${{needs.release_draft.outputs.version}}
          comp:    ${{matrix.comp}}
          archive: ${{matrix.archive}}
          link:    ${{matrix.link}}

      - name: Upload qt build
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Store qt build in release page
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{secrets.GITHUB_TOKEN}}
          file:       "${{github.workspace}}/${{steps.build.outputs.fn}}"
          asset_name: ${{steps.build.outputs.fn}}
          release_id: ${{needs.release_draft.outputs.release_id}}
          overwrite:  true

  windows-msvc:
    needs: release_draft
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build qt
        uses: ./.github/actions/windows-msvc
        id: build
        with:
          version: ${{needs.release_draft.outputs.version}}

      - name: Upload qt build
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.build.outputs.fn}}
          path: "${{github.workspace}}/${{steps.build.outputs.fn}}"

      - name: Store qt build in release page
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{secrets.GITHUB_TOKEN}}
          file:       "${{github.workspace}}/${{steps.build.outputs.fn}}"
          asset_name: ${{steps.build.outputs.fn}}
          release_id: ${{needs.release_draft.outputs.release_id}}
          overwrite:  true

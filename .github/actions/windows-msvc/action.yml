name: Build on Windows with MSVC

inputs:
  version:
    required: true
    description: "Qt long version"
outputs:
  fn:
    description: "Filename"
    value: ${{steps.pack.outputs.fn}}

runs:
  using: composite
  steps:
    - name: env
      shell: powershell
      run: |
        $v = '${{inputs.version}}'
        $vv = ($v -split '\.')[0..1] -join '.'
        $os = $env:RUNNER_OS.ToLower()
        $arch = $env:PROCESSOR_ARCHITECTURE.ToLower()
        Add-Content -Path $env:GITHUB_ENV -Value "v=${v}"
        Add-Content -Path $env:GITHUB_ENV -Value "vv=${vv}"
        Add-Content -Path $env:GITHUB_ENV -Value "os=${os}"
        Add-Content -Path $env:GITHUB_ENV -Value ("arch=" + ($arch -replace '^amd64$', 'x64'))
    - name: set up MSVC
      shell: powershell
      run: |
        $vswhere = Get-ChildItem `
          -Path "C:\Program Files (x86)\Microsoft Visual Studio\Installer", `
                "C:\Program Files (Arm)\Microsoft Visual Studio\Installer", `
                "C:\Program Files\Microsoft Visual Studio\Installer" `
          -Filter vswhere.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
        if (-not $vswhere) { throw "vswhere.exe not found" }
        $vspath = & $vswhere -latest -products * -property installationPath
        $vscmd = Get-ChildItem -Path $vspath -Filter VsDevCmd.bat -Recurse -ErrorAction SilentlyContinue |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $vscmd) { throw "VsDevCmd.bat not found in $vspath" }
        $vsver = (& $vswhere -latest -products * -property installationVersion) -split '\.' | Select-Object -First 1
        $vsyear = switch ($vsver) {
          '16' { '2019' }
          '17' { '2022' }
          '18' { '2026' }
          default { throw "Unrecognized Visual Studio version $vsver" }
        }
        Add-Content -Path $env:GITHUB_ENV -Value "vscmd=${vscmd}"
        Add-Content -Path $env:GITHUB_ENV -Value "vsyear=${vsyear}"
        Remove-Item C:\mingw64 -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item "C:\Program Files\LLVM" -Recurse -Force -ErrorAction SilentlyContinue
    - name: download and unpack
      shell: powershell
      run: |
        Start-BitsTransfer -Source `
          "https://download.qt.io/archive/qt/${{env.vv}}/${{env.v}}/single/qt-everywhere-src-${{env.v}}.zip" `
          -Destination .
        7z x .\qt-everywhere-src-${{env.v}}.zip -o"./"
        Rename-Item -Path "qt-everywhere-src-${{env.v}}" -NewName "qt"
        mkdir qt\build
    - name: configure
      shell: cmd
      run: |
        call "${{env.vscmd}}" -arch=${{env.arch}} -host_arch=${{env.arch}}
        cd qt\build
        ..\configure.bat ^
          -prefix "${{github.workspace}}\qt${{env.v}}_static_${{env.os}}_msvc${{env.vsyear}}_${{env.arch}}" ^
          -platform win32-msvc ^
          -release ^
          -static ^
          -static-runtime ^
          -opensource ^
          -confirm-license ^
          -feature-relocatable ^
          -nomake examples ^
          -nomake tests ^
          -skip qtwebengine ^
          -no-openssl
    - name: build
      shell: cmd
      run: |
        call "${{env.vscmd}}" -arch=${{env.arch}} -host_arch=${{env.arch}}
        cd qt\build
        cmake --build .
    - name: install
      shell: cmd
      run: |
        call "${{env.vscmd}}" -arch=${{env.arch}} -host_arch=${{env.arch}}
        cd qt\build
        cmake --install .
    - name: pack
      id: pack
      shell: powershell
      run: |
        7z a -tzip `
          ".\qt${{env.v}}_static_${{env.os}}_msvc${{env.vsyear}}_${{env.arch}}.zip" `
          ".\qt${{env.v}}_static_${{env.os}}_msvc${{env.vsyear}}_${{env.arch}}\*"
        Add-Content -Path $env:GITHUB_OUTPUT -Value `
          "fn=qt${{env.v}}_static_${{env.os}}_msvc${{env.vsyear}}_${{env.arch}}.zip"
